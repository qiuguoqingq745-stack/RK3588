<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#355070" />
    </marker>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1f2a44; }
      .subtitle { font: 400 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #4a5568; }
      .lane-title { font: 700 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #233142; }
      .box-title { font: 700 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1f2937; }
      .box-text { font: 400 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #334155; }
      .small { font: 400 13px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #d9e2ec; stroke-width: 2; rx: 14; }
      .box-main { fill: #ffffff; stroke: #355070; stroke-width: 2; rx: 12; }
      .box-shared { fill: #fff7e6; stroke: #d97706; stroke-width: 2; rx: 12; }
      .box-stream { fill: #eefbf3; stroke: #2f855a; stroke-width: 2; rx: 12; }
      .arrow { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1180" fill="#f4f7fb" />
  <text x="60" y="55" class="title">RK3588 多线程项目线程与数据流时序图</text>
  <text x="60" y="84" class="subtitle">入口: main.cpp | 解码: stream_loader.cpp | 推流: streaming_manager.cpp</text>

  <rect x="40" y="120" width="1720" height="140" class="lane" />
  <text x="60" y="150" class="lane-title">1. 启动阶段</text>
  <rect x="70" y="170" width="260" height="60" class="box-main" />
  <text x="95" y="197" class="box-title">main 线程</text>
  <text x="95" y="220" class="box-text">读取 argv[1]，配置 RTMP / FPS / 分辨率</text>

  <rect x="410" y="170" width="280" height="60" class="box-stream" />
  <text x="435" y="197" class="box-title">StreamingManager::initialize()</text>
  <text x="435" y="220" class="box-text">初始化 FFmpeg 封装 + MPP 编码器</text>

  <rect x="770" y="170" width="260" height="60" class="box-main" />
  <text x="795" y="197" class="box-title">load_stream(i)</text>
  <text x="795" y="220" class="box-text">每路创建 1 个 StreamLoader 线程</text>

  <rect x="1110" y="170" width="280" height="60" class="box-main" />
  <text x="1135" y="197" class="box-title">rknn_infer(..., i)</text>
  <text x="1135" y="220" class="box-text">每路创建 1 个推理线程</text>

  <rect x="1470" y="170" width="230" height="60" class="box-main" />
  <text x="1495" y="197" class="box-title">combineImage</text>
  <text x="1495" y="220" class="box-text">启动拼图线程</text>

  <line x1="330" y1="200" x2="410" y2="200" class="arrow" />
  <line x1="690" y1="200" x2="770" y2="200" class="arrow" />
  <line x1="1030" y1="200" x2="1110" y2="200" class="arrow" />
  <line x1="1390" y1="200" x2="1470" y2="200" class="arrow" />

  <rect x="40" y="300" width="1720" height="250" class="lane" />
  <text x="60" y="330" class="lane-title">2. 每路视频的解码与推理</text>

  <rect x="80" y="370" width="270" height="90" class="box-main" />
  <text x="105" y="398" class="box-title">StreamLoader 线程</text>
  <text x="105" y="423" class="box-text">av_read_frame()</text>
  <text x="105" y="446" class="box-text">decoder.Decode()</text>

  <rect x="430" y="370" width="250" height="90" class="box-main" />
  <text x="455" y="398" class="box-title">MPP 解码回调</text>
  <text x="455" y="423" class="box-text">NV12 -&gt; BGR</text>
  <text x="455" y="446" class="box-text">RGA 优先, OpenCV 回退</text>

  <rect x="760" y="370" width="240" height="90" class="box-shared" />
  <text x="785" y="398" class="box-title">buffer.img</text>
  <text x="785" y="423" class="box-text">每路共享缓冲</text>
  <text x="785" y="446" class="box-text">只保留最新一帧</text>

  <rect x="1080" y="350" width="310" height="130" class="box-main" />
  <text x="1105" y="378" class="box-title">rknn_infer 线程</text>
  <text x="1105" y="403" class="box-text">加锁读取 buffer.img 并 clone</text>
  <text x="1105" y="426" class="box-text">INFER_INTERVAL = 2, 隔帧推理</text>
  <text x="1105" y="449" class="box-text">其余帧复用 last_fused</text>

  <rect x="1470" y="350" width="240" height="130" class="box-main" />
  <text x="1495" y="378" class="box-title">RKNN 多模型</text>
  <text x="1495" y="403" class="box-text">person</text>
  <text x="1495" y="426" class="box-text">helmet</text>
  <text x="1495" y="449" class="box-text">callplay</text>

  <line x1="350" y1="415" x2="430" y2="415" class="arrow" />
  <line x1="680" y1="415" x2="760" y2="415" class="arrow" />
  <line x1="1000" y1="415" x2="1080" y2="415" class="arrow" />
  <line x1="1390" y1="415" x2="1470" y2="415" class="arrow" />

  <rect x="1080" y="500" width="310" height="40" class="box-main" />
  <text x="1105" y="526" class="box-text">g1/g2/g4 检测结果</text>
  <line x1="1590" y1="480" x2="1590" y2="500" class="arrow" />

  <rect x="40" y="590" width="1720" height="220" class="lane" />
  <text x="60" y="620" class="lane-title">3. 融合、画框、拼图</text>

  <rect x="120" y="660" width="290" height="100" class="box-main" />
  <text x="145" y="688" class="box-title">DetectionFusionManager</text>
  <text x="145" y="713" class="box-text">fuseDetections(g1, g2, g3, g4)</text>
  <text x="145" y="736" class="box-text">Person+Helmet 用 IoM</text>

  <rect x="500" y="660" width="260" height="100" class="box-main" />
  <text x="525" y="688" class="box-title">drawFusedDetections()</text>
  <text x="525" y="713" class="box-text">在单路 ori_img 上画框</text>
  <text x="525" y="736" class="box-text">生成成品单路图</text>

  <rect x="850" y="660" width="240" height="100" class="box-shared" />
  <text x="875" y="688" class="box-title">images[i]</text>
  <text x="875" y="713" class="box-text">全局成品帧区</text>
  <text x="875" y="736" class="box-text">推理线程写, 拼图线程读</text>

  <rect x="1180" y="650" width="310" height="120" class="box-main" />
  <text x="1205" y="678" class="box-title">combineImage 线程</text>
  <text x="1205" y="703" class="box-text">按 24fps 轮询 images[i]</text>
  <text x="1205" y="726" class="box-text">每路缩放为 640 x 360</text>
  <text x="1205" y="749" class="box-text">按 2 列 3 行拼成总图</text>

  <line x1="1390" y1="520" x2="265" y2="660" class="arrow dashed" />
  <line x1="410" y1="710" x2="500" y2="710" class="arrow" />
  <line x1="760" y1="710" x2="850" y2="710" class="arrow" />
  <line x1="1090" y1="710" x2="1180" y2="710" class="arrow" />

  <rect x="40" y="850" width="1720" height="250" class="lane" />
  <text x="60" y="880" class="lane-title">4. 推流线程</text>

  <rect x="100" y="930" width="260" height="100" class="box-shared" />
  <text x="125" y="958" class="box-title">streaming_queue_</text>
  <text x="125" y="983" class="box-text">combineImage addStreamingData()</text>
  <text x="125" y="1006" class="box-text">队列满时丢最旧帧</text>

  <rect x="450" y="920" width="310" height="120" class="box-stream" />
  <text x="475" y="948" class="box-title">streamingWorker 线程</text>
  <text x="475" y="973" class="box-text">wait_for + pop</text>
  <text x="475" y="996" class="box-text">超时则复用上一帧保活</text>
  <text x="475" y="1019" class="box-text">必要时 resize 到推流分辨率</text>

  <rect x="850" y="930" width="250" height="100" class="box-stream" />
  <text x="875" y="958" class="box-title">MppEncoder</text>
  <text x="875" y="983" class="box-text">BGR -&gt; YUV420P</text>
  <text x="875" y="1006" class="box-text">YUV -&gt; H.264</text>

  <rect x="1190" y="930" width="250" height="100" class="box-stream" />
  <text x="1215" y="958" class="box-title">FFmpeg RTMP 封装</text>
  <text x="1215" y="983" class="box-text">av_interleaved_write_frame()</text>
  <text x="1215" y="1006" class="box-text">写入 FLV/RTMP</text>

  <rect x="1530" y="930" width="180" height="100" class="box-stream" />
  <text x="1555" y="970" class="box-title">RTMP 服务器</text>
  <text x="1555" y="995" class="box-text">直播输出</text>

  <line x1="1490" y1="710" x2="230" y2="930" class="arrow dashed" />
  <line x1="360" y1="980" x2="450" y2="980" class="arrow" />
  <line x1="760" y1="980" x2="850" y2="980" class="arrow" />
  <line x1="1100" y1="980" x2="1190" y2="980" class="arrow" />
  <line x1="1440" y1="980" x2="1530" y2="980" class="arrow" />

  <rect x="1410" y="120" width="330" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="10" />
  <text x="1435" y="148" class="box-title">图例</text>
  <text x="1435" y="172" class="small">蓝框: 线程 / 模块</text>
  <text x="1435" y="194" class="small">橙框: 共享缓冲区</text>
  <text x="1565" y="172" class="small">绿框: 推流链路</text>
  <text x="1565" y="194" class="small">虚线: 跨阶段数据传递</text>
</svg>
